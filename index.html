<style>
  :root { color-scheme: light dark; --bg:#f4f4f1; --card:#fff; --ink:#1d1d1b; --quiet:#77776f; --faint:#b4b4ac; --line:#dcdcd6; --field:#f1f1ec;
          --accent:#2f6fd6; --accent-soft:#e8effb; --ok:#2e7d32; --bad:#c62828; --warn:#9a5800; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141413; --card:#1f1f1d; --ink:#ececea; --quiet:#a3a39d; --faint:#5e5e59; --line:#383835; --field:#2a2a27;
          --accent:#6ea0f0; --accent-soft:#1d2a40; --ok:#7bc47f; --bad:#ef7a7a; --warn:#e0a458; } }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; padding: calc(10px + env(safe-area-inset-top)) 12px calc(32px + env(safe-area-inset-bottom)); background:var(--bg); color:var(--ink);
         font: 16px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust: 100%; }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 26px; margin: 4px 0 2px; }
  h2 { font-size: 15px; margin: 0 0 8px; color: var(--quiet); text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
  .sub { color: var(--quiet); margin: 0 0 14px; font-size: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 12px; }
  button { font: inherit; font-weight: 600; border-radius: 12px; border: 1px solid var(--accent); background: var(--accent); color: #fff; padding: 14px; width: 100%; margin: 6px 0; }
  button.secondary { background: transparent; color: var(--accent); }
  button.link { background: none; border: none; color: var(--accent); width: auto; padding: 6px 0; margin: 0; font-weight: 500; }
  button.small { width: auto; padding: 7px 12px; font-size: 14px; margin: 8px 0 0; background: transparent; color: var(--accent); }
  .choices { display: grid; grid-template-columns: 1fr; gap: 8px; }
  .choices.two { grid-template-columns: 1fr 1fr; }
  .choice { background: var(--card); color: var(--ink); border: 1px solid var(--line); text-align: left; margin: 0; }
  .choice small { display: block; color: var(--quiet); font-weight: 400; font-size: 13px; margin-top: 2px; }
  .choice.on { border: 2px solid var(--accent); background: var(--accent-soft); }
  .label { font-size: 13px; color: var(--quiet); text-transform: uppercase; letter-spacing: .04em; margin: 16px 0 6px; }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .muted { color: var(--quiet); font-size: 14px; }
  .err { color: var(--bad); font-size: 14px; white-space: pre-wrap; }

  /* Übungsblöcke */
  .blockhead { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .num { width: 26px; height: 26px; border-radius: 50%; background: var(--ink); color: var(--card); font-size: 14px; font-weight: 700; display: grid; place-items: center; flex: none; }
  .kind { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--quiet); }
  .card.superset { border: 2px solid var(--accent); }
  .card.superset .kind { color: var(--accent); }
  .exhead { margin: 2px 0 6px; }
  .exhead .name { font-size: 19px; font-weight: 700; }
  .exhead .letter { color: var(--accent); font-weight: 800; margin-right: 4px; }
  .goal { font-size: 13px; color: var(--quiet); margin-top: 1px; }
  .goal.up { color: var(--warn); font-weight: 600; }
  .exsep { height: 1px; background: var(--line); margin: 12px 0; }

  table.sets { width: 100%; border-collapse: collapse; }
  table.sets th { font-size: 11.5px; color: var(--quiet); font-weight: 600; text-align: left; padding: 0 4px 4px; text-transform: uppercase; letter-spacing: .03em; }
  table.sets td { padding: 3px 4px; vertical-align: middle; }
  table.sets td.n { color: var(--quiet); font-size: 14px; width: 28px; padding-left: 0; }
  input.f { font: inherit; font-size: 20px; font-weight: 700; width: 100%; min-width: 0; border: 1px solid transparent; background: var(--field); color: var(--ink);
            border-radius: 10px; padding: 8px 6px; text-align: center; -webkit-appearance: none; appearance: none; }
  input.f::placeholder { color: var(--faint); font-weight: 600; }
  input.f:focus { outline: none; border-color: var(--accent); background: var(--card); }
  input.f.done { background: var(--accent-soft); }
  .unit { font-size: 12px; color: var(--quiet); }
  .droprow td { padding-top: 0; }
  .drop { font-size: 13px; color: var(--quiet); display: flex; gap: 6px; align-items: center; }
  .drop input.f { font-size: 16px; padding: 5px 4px; width: 64px; }
  .tiny { font-size: 12.5px; border: none; background: none; color: var(--accent); padding: 2px 0; margin: 0; width: auto; font-weight: 600; }
  select.grip { font: inherit; font-size: 12px; color: var(--quiet); background: none; border: none; padding: 0; margin-top: 2px; max-width: 100%; }

  .tools { margin-left: auto; display: flex; gap: 4px; }
  .iconbtn { width: 34px; height: 34px; padding: 0; margin: 0; border-radius: 9px; background: var(--field); color: var(--ink); border: none; font-size: 16px; font-weight: 700; }
  .iconbtn:disabled { opacity: .3; }
  .sslink { font-size: 12px; font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: .08em; margin: 6px 0 2px; }
  th.grp { text-transform: none; color: var(--accent); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 1px; }
  td.ok { width: 40px; padding-right: 0; }
  .tick { width: 38px; height: 40px; padding: 0; margin: 0; border-radius: 10px; background: var(--field); color: var(--faint); border: 1px solid var(--line); font-size: 18px; }
  .tick.on { background: var(--ok); color: #fff; border-color: var(--ok); }
  .tiny.quiet { color: var(--quiet); font-weight: 500; margin-left: 6px; }
  .grow { flex: 1; }
  .check { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 16px; }
  .check:first-of-type { border-top: none; }
  .check input { width: 22px; height: 22px; accent-color: var(--accent); flex: none; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .status { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 4px 0 6px; font-size: 13px; color: var(--quiet); text-align: right; }
  .status.ok { color: var(--ok); } .status.bad { color: var(--bad); }
</style>

  const body = JSON.stringify(obj, null, 1);
  for (let attempt = 0; attempt < 3; attempt++) {
    const res = await fetch(fileUrl(name), { method: "PUT", headers: { Authorization: "Bearer " + await token(), "Content-Type": "application/json" }, body });
    if (res.ok) return true;
    if (attempt < 2) await new Promise(r => setTimeout(r, 1200 * (attempt + 1)));
    else throw new Error("Speichern fehlgeschlagen (" + res.status + ")");
  }
}

// ------------------------------------------------------------ Auswertung
const EXMAP = () => Object.fromEntries(data.exercises.map(e => [e.id, e]));
const SPLIT = id => (data.splits.find(s => s.id === id) || {}).name || id;
const LOC = id => (data.locations.find(l => l.id === id) || {}).name || id;
const sessionsDesc = () => [...data.sessions].filter(s => !s.inProgress).sort((a, b) => b.date.localeCompare(a.date));

function lastSessionOf(split, location) {
  const all = sessionsDesc().filter(s => s.split === split && s.items.length);
  return all.find(s => s.location === location) || all[0] || null;
}
function itemKey(it) { return it.exercises.join("+"); }
function occurrence(session, item) { const k = itemKey(item); let n = 0; for (const it of session.items) { if (it === item) return n; if (itemKey(it) === k) n++; } return 0; }
function itemSets(it, exId, withWarmup) { const j = it.exercises.indexOf(exId); return it.sets.map(r => r[j]).filter(e => e && (withWarmup || !e.warmup)); }
function lastFor(exId, location, tplSession, tplItem) {
  const key = itemKey(tplItem), occ = occurrence(tplSession, tplItem);
  const ordered = sessionsDesc().filter(s => s.location === location).concat(sessionsDesc().filter(s => s.location !== location));
  for (const s of ordered) {
    const same = s.items.filter(it => itemKey(it) === key);
    if (same.length) { const it = same[Math.min(occ, same.length - 1)]; if (itemSets(it, exId).length) return { session: s, item: it }; }
  }
  for (const s of ordered) { const it = s.items.find(x => x.exercises.includes(exId)); if (it && itemSets(it, exId).length) return { session: s, item: it }; }
  return null;
}
function nextHeavier(exId, w) {
  let best = null;
  for (const s of data.sessions) for (const it of s.items) { const j = it.exercises.indexOf(exId); if (j < 0) continue;
    for (const r of it.sets) { const x = r[j] && r[j].weight; if (x > w && (best == null || x < best)) best = x; } }
  return best;
}
// Ziel für heute: kurzer Satz + vorbelegtes Gewicht
function goal(exId, sets) {
  const ex = EXMAP()[exId];
  if (!sets.length) return { text: "Erstes Mal – trag ein, was du schaffst" };
  if (ex.measure === "time") {
    if (sets.every(s => (s.seconds || 0) >= 60)) return { text: "60 s erreicht – schwerere Variante versuchen", up: true };
    return { text: "Ziel: je 5 Sekunden länger" };
  }
  if (ex.measure === "weight") {
    const w = Math.max(...sets.map(s => s.weight || 0));
    if (!w) return sets.every(s => s.reps >= 12) ? { text: "Alle Sätze bei 12 – Gewicht erhöhen", up: true } : { text: "Ziel: je 1 Wiederholung mehr" };
    const work = sets.filter(s => (s.weight || 0) === w);
    if (work.every(s => s.reps >= 12)) {
      if (ex.equipment === "maschine") return { text: "Gewicht erhöhen: nächste Stufe über " + kg(w) + " kg, Ziel 8 Wdh.", up: true, weight: w };
      const nw = nextHeavier(exId, w) || w + 2.5;
      return { text: "Gewicht erhöhen auf " + kg(nw) + " kg, Ziel 8 Wdh.", up: true, weight: nw };
    }
    return { text: "Ziel: je 1 Wiederholung mehr, bis 12", weight: w };
  }
  const weighted = sets.filter(s => s.added), plain = sets.filter(s => !s.added);
  const [lo, hi] = ["klimmzuege", "dips", "liegestuetze", "australian-pullups"].includes(exId) ? [5, 8] : [8, 12];
  if (weighted.length) {
    const a = Math.max(...weighted.map(s => s.added));
    if (weighted.filter(s => s.added === a).every(s => s.reps >= hi)) return { text: "Zusatzgewicht erhöhen auf +" + kg(a + 2.5) + " kg, Ziel " + lo + " Wdh.", up: true, added: a + 2.5 };
    return { text: "Ziel: je 1 Wiederholung mehr, bis " + hi, added: a };
  }
  if (plain.every(s => s.reps >= 12)) return { text: "Alle Sätze bei 12 – Zusatzgewicht oder schwerere Variante", up: true };
  return { text: "Ziel: je 1 Wiederholung mehr, bis 12" };
}

// ------------------------------------------------------------ Entwurf (wird bei jeder Eingabe auf dem iPhone gesichert)
const DRAFT_VERSION = 3;
const RANGE = exId => ["klimmzuege", "dips", "liegestuetze", "australian-pullups"].includes(exId) ? [5, 8] : [8, 12];

// Zielwerte für einen Satz heute, aus dem Satz vom letzten Mal und dem Ziel der Übung
function targetFor(exId, prev, g) {
  const ex = EXMAP()[exId];
  const e = { reps: null, seconds: null };
  if (!prev) {
    if (ex.measure === "weight") e.weight = g && g.weight != null ? g.weight : null;
    return e;
  }
  if (prev.grip) e.grip = prev.grip;
  if (prev.perSide) e.perSide = true;
  if (ex.measure === "time") e.seconds = (g && g.up) ? prev.seconds : Math.min(60, (prev.seconds || 0) + 5);
  else if (ex.measure === "weight") {
    if (g && g.up) { e.weight = g.weight != null ? g.weight : (prev.weight ?? null); e.reps = 8; }
    else { e.weight = prev.weight != null ? prev.weight : null; e.reps = Math.min(12, prev.reps + 1); }
    if (g && g.up && ex.equipment === "maschine") e.weightHint = "nächste Stufe";
  } else {
    const [lo, hi] = RANGE(exId);
    if (prev.added) {
      if (g && g.up && g.added != null) { e.added = g.added; e.reps = lo; }
      else { e.added = prev.added; e.reps = Math.min(hi, prev.reps + 1); }
    } else { e.added = null; e.reps = Math.min(12, prev.reps + 1); }
  }
  if (prev.drop) e.drop = { reps: prev.drop.reps ?? null, weight: prev.drop.weight != null ? prev.drop.weight : null, ex: prev.drop.ex || null, open: true };
  return e;
}
function makeItem(exercises, location, tplSession, tplItem) {
  const tItem = tplItem || { exercises };
  const tSess = tplSession || { items: [tItem] };
  const lasts = exercises.map(ex => lastFor(ex, location, tSess, tItem));
  const prevSets = exercises.map((ex, j) => lasts[j] ? itemSets(lasts[j].item, ex) : []);
  const goals = exercises.map((ex, j) => goal(ex, prevSets[j]));
  const n = Math.max(prevSets.some(p => p.length) ? 1 : 3, ...prevSets.map(p => p.length));
  return { exercises: [...exercises], goals,
           sets: Array.from({ length: n }, (_, k) => exercises.map((ex, j) => targetFor(ex, prevSets[j][k] || prevSets[j][prevSets[j].length - 1] || null, goals[j]))),
           done: Array.from({ length: n }, () => false) };
}
function addExerciseToItem(it, exId, location) {
  const l = lastFor(exId, location, { items: [{ exercises: [exId] }] }, { exercises: [exId] });
  const prev = l ? itemSets(l.item, exId) : [];
  const g = goal(exId, prev);
  it.exercises.push(exId); it.goals.push(g);
  it.sets.forEach((row, k) => row.push(targetFor(exId, prev[k] || prev[prev.length - 1] || null, g)));
}
function newDraft(split, location) {
  const tpl = lastSessionOf(split, location);
  const d = { v: DRAFT_VERSION, id: null, date: todayISO(), location, split, startedAt: new Date().toISOString(), templateId: tpl ? tpl.id : null,
              warmup: tpl ? tpl.warmup.map(w => ({ ...w, done: false })) : (split === "core" || location === "homegym" ? [] : [{ name: "Stepper", minutes: 5, done: false }]),
              items: tpl ? tpl.items.map(it => makeItem(it.exercises, location, tpl, it)) : [],
              stretches: stretchList(split).map(s => ({ ...s, done: false })), bodyweight: null, coreDone: false };
  return d;
}
function stretchList(split) {
  // eigene Reihenfolge aus dem letzten Training dieses Typs, danach alle übrigen nach Häufigkeit
  const last = sessionsDesc().find(s => s.split === split && s.stretchOrder && s.stretchOrder.length);
  const count = new Map();
  for (const s of data.sessions) if (s.split === split) for (const x of s.stretches || []) {
    const k = x.id + "|" + (x.side || ""); count.set(k, (count.get(k) || 0) + 1);
  }
  const order = [...count.entries()].sort((a, b) => b[1] - a[1]).map(([k]) => k);
  const out = [], seen = new Set();
  const push = (id, side) => { const k = id + "|" + (side || ""); if (!seen.has(k)) { seen.add(k); out.push({ id, side: side || null }); } };
  if (last) for (const x of last.stretchOrder) push(x.id, x.side);
  const ids = new Set();
  for (const k of order) { const [id] = k.split("|"); if (ids.has(id)) continue; ids.add(id);
    for (const side of ["rechts", "links", ""]) if (order.includes(id + "|" + side)) push(id, side); }
  return out;
}
let saveTimer = null;
function saveDraft() {

  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => syncDraft(false), 4000);

// ------------------------------------------------------------ Speichern in OneDrive
function draftToSession(d, finished) {
  const items = d.items.map(it => {
    const sets = it.sets.filter((row, k) => it.done[k]).map(row => row.map((e, j) => {
      const ex = EXMAP()[it.exercises[j]]; const o = {};
      if (ex.measure === "time") { if (e.seconds == null) return null; o.seconds = e.seconds; }
      else { if (e.reps == null) return null; o.reps = e.reps; }
      if (e.weight != null && ex.measure === "weight") o.weight = e.weight;
      if (e.added) o.added = e.added;
      if (e.perSide) o.perSide = true;
      if (e.grip) o.grip = e.grip;
      if (e.drop && e.drop.reps != null) { o.drop = { reps: e.drop.reps }; if (e.drop.weight != null) o.drop.weight = e.drop.weight; if (e.drop.ex) o.drop.ex = e.drop.ex; }
      return o;
    })).filter(row => row.some(Boolean)).map(row => row.map(e => e || {}));
    return { exercises: it.exercises, sets };
  }).filter(it => it.sets.length);
  const s = { id: d.id || (d.date + "-" + d.location + "-" + d.split + "-" + d.startedAt.slice(11, 16).replace(":", "")),
              date: d.date, location: d.location, split: d.split,
              warmup: d.warmup.filter(w => w.done).map(({ name, minutes }) => ({ name, minutes })), cooldown: [],
              items, stretches: d.stretches.filter(x => x.done).map(({ id, side }) => side ? { id, side } : { id }),
              stretchDone: d.stretches.some(x => x.done), stretchOrder: d.stretches.map(({ id, side }) => side ? { id, side } : { id }),
              bodyweight: d.bodyweight, source: "fitnesstool" };
  if (d.split === "core") s.core = !!d.coreDone;
  if (!finished) s.inProgress = true;
  return s;
}
let syncing = false;
async function syncDraft(finished) {
  if (!draft) return;
  const session = draftToSession(draft, finished);
  draft.id = session.id; store(DRAFT_KEY, JSON.stringify(draft));
  store(PENDING_KEY, JSON.stringify(session));
  if (syncing) return; syncing = true;
  try { await pushSession(session); setStatus("In OneDrive gespeichert " + new Date().toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" }), "ok"); }
  catch (e) { setStatus("Noch nicht in OneDrive – wird erneut versucht (auf dem iPhone gesichert)", "bad"); if (finished) throw e; }
  finally { syncing = false; }
}
async function pushSession(session) {
  const fresh = await getJSON(DATA_FILE);
  if (!fresh) throw new Error("Datendatei fehlt in OneDrive");
  const day = todayISO(), bk = "ft_sicherung_" + day;
  if (!load(bk)) { try { await putJSON("sicherung/fitnesstool-daten-" + day + ".json", fresh); store(bk, "1"); } catch (e) {} }
  const i = fresh.sessions.findIndex(s => s.id === session.id);
  if (i >= 0) fresh.sessions[i] = session; else fresh.sessions.push(session);
  await putJSON(DATA_FILE, fresh);
  data = fresh; store(CACHE_KEY, JSON.stringify(data));
  const p = load(PENDING_KEY); if (p && JSON.parse(p).id === session.id && JSON.stringify(JSON.parse(p)) === JSON.stringify(session)) drop(PENDING_KEY);
}
async function flushPending() { const p = load(PENDING_KEY); if (!p) return; try { await pushSession(JSON.parse(p)); } catch (e) {} }
function setStatus(t, cls) { const el = document.getElementById("status"); if (el) { el.textContent = t; el.className = "status " + (cls || ""); } }

const hasGrip = exId => exId === "klimmzuege" || /^rudern/.test(exId);

      <button class="secondary" id="addex">+ Übung hinzufügen</button>
      ${d.stretches.length ? `<div class="card" style="margin-top:12px"><h2>Dehnen · 20-s-Intervalle</h2>${d.stretches.map((s, n) => `<div class="check"><input type="checkbox" data-str="${n}" ${s.done ? "checked" : ""} id="str${n}"><label for="str${n}" class="grow">${esc(SN[s.id] || s.id)}${s.side ? " " + esc(s.side) : ""}</label>
        <button class="iconbtn" data-sup="${n}" ${n === 0 ? "disabled" : ""} aria-label="Nach oben">↑</button><button class="iconbtn" data-sdown="${n}" ${n === d.stretches.length - 1 ? "disabled" : ""} aria-label="Nach unten">↓</button></div>`).join("")}</div>` : ""}`;
  }
  app.innerHTML = `<div id="status" class="status">Auf dem iPhone gesichert</div>
    <div class="bar"><button class="link" id="back">‹ Abbrechen</button></div>
    <h1>${esc(SPLIT(d.split))}</h1>
    <p class="sub">${esc(LOC(d.location))}${tpl ? " · Vorlage vom " + dateDE(tpl.date) : ""} · Werte sind die Ziele für heute, ✓ bestätigt den Satz</p>
    ${body}
    <div class="card"><div class="row2">
      <label><div class="muted">Datum</div><input class="f" type="date" id="date" value="${d.date}" style="font-size:16px"></label>
      <label><div class="muted">Körpergewicht (optional)</div><input class="f" inputmode="decimal" id="bw" placeholder="kg" value="${d.bodyweight != null ? kg(d.bodyweight) : ""}" style="font-size:16px"></label>
    </div></div>
    <button id="finish">Training beenden und speichern</button>`;
  bindWorkout();
}
function setPath(path, raw) {
  const [i, k, j, ...rest] = path.split(".");
  const it = draft.items[+i], e = it.sets[+k][+j], key = rest.join(".");
  const v = key === "grip" ? (raw || null) : parseNum(raw);
  if (key.startsWith("drop.")) { e.drop = e.drop || { open: true }; e.drop[key.slice(5)] = v; }
  else e[key] = v;
  if (key === "reps" || key === "seconds") it.done[+k] = true;
}
function rowHasValues(it, k) { return it.sets[k].some((e, j) => (EXMAP()[it.exercises[j]].measure === "time" ? e.seconds : e.reps) != null); }
function bindWorkout() {
  const $$ = s => app.querySelectorAll(s), num = s => s.split(".").map(Number), rerender = () => { saveDraft(); keepScroll(showWorkout); };
  $$("[data-k]").forEach(el => {
    el.addEventListener("input", () => { const before = draft.items[+el.dataset.k.split(".")[0]].done[+el.dataset.k.split(".")[1]];
      setPath(el.dataset.k, el.value); saveDraft();
      const [i, k] = num(el.dataset.k); if (!before && draft.items[i].done[k]) markRow(i, k); });
    el.addEventListener("change", () => { setPath(el.dataset.k, el.value); saveDraft(); });
  });
  $$("[data-tick]").forEach(b => b.onclick = () => { const [i, k] = num(b.dataset.tick); const it = draft.items[i];
    if (!it.done[k] && !rowHasValues(it, k)) { alert("Bitte zuerst Wiederholungen eintragen."); return; }
    it.done[k] = !it.done[k]; rerender(); });
  $$("[data-drop]").forEach(b => b.onclick = () => { const [i, k, j] = num(b.dataset.drop); draft.items[i].sets[k][j].drop = { reps: null, weight: null, open: true }; rerender(); });
  $$("[data-dropoff]").forEach(b => b.onclick = () => { const [i, k, j] = num(b.dataset.dropoff); delete draft.items[i].sets[k][j].drop; rerender(); });
  $$("[data-addset]").forEach(b => b.onclick = () => { const it = draft.items[+b.dataset.addset], last = it.sets[it.sets.length - 1];
    it.sets.push(last.map(e => ({ weight: e.weight ?? null, added: e.added ?? null, grip: e.grip ?? null, perSide: e.perSide, reps: e.reps ?? null, seconds: e.seconds ?? null })));
    it.done.push(false); rerender(); });
  $$("[data-rmset]").forEach(b => b.onclick = () => { const [i, k] = num(b.dataset.rmset); const it = draft.items[i];
    if (it.done[k] && !confirm("Satz " + (k + 1) + " ist schon erledigt. Trotzdem entfernen?")) return;
    it.sets.splice(k, 1); it.done.splice(k, 1); rerender(); });
  $$("[data-up]").forEach(b => b.onclick = () => { const i = +b.dataset.up; if (i > 0) { const a = draft.items; [a[i - 1], a[i]] = [a[i], a[i - 1]]; rerender(); } });
  $$("[data-down]").forEach(b => b.onclick = () => { const i = +b.dataset.down, a = draft.items; if (i < a.length - 1) { [a[i + 1], a[i]] = [a[i], a[i + 1]]; rerender(); } });
  $$("[data-rm]").forEach(b => b.onclick = () => { const i = +b.dataset.rm, it = draft.items[i];
    const names = it.exercises.map(x => EXMAP()[x].name).join(" Supersatz ");
    if (!confirm(names + (it.done.some(Boolean) ? " hat schon erledigte Sätze. Trotzdem entfernen?" : " entfernen?"))) return;
    draft.items.splice(i, 1); rerender(); });
  $$("[data-rmex]").forEach(b => b.onclick = () => { const [i, j] = num(b.dataset.rmex), it = draft.items[i];
    if (!confirm(EXMAP()[it.exercises[j]].name + " aus dem Supersatz nehmen?")) return;
    it.exercises.splice(j, 1); it.goals.splice(j, 1); it.sets.forEach(r => r.splice(j, 1)); rerender(); });
  $$("[data-addss]").forEach(b => b.onclick = () => pickExercise(+b.dataset.addss));
  $$("[data-warm]").forEach(c => c.onchange = () => { draft.warmup[+c.dataset.warm].done = c.checked; saveDraft(); });
  $$("[data-str]").forEach(c => c.onchange = () => { draft.stretches[+c.dataset.str].done = c.checked; saveDraft(); });
  $$("[data-sup]").forEach(b => b.onclick = () => { const n = +b.dataset.sup, a = draft.stretches; if (n > 0) { [a[n - 1], a[n]] = [a[n], a[n - 1]]; rerender(); } });
  $$("[data-sdown]").forEach(b => b.onclick = () => { const n = +b.dataset.sdown, a = draft.stretches; if (n < a.length - 1) { [a[n + 1], a[n]] = [a[n], a[n + 1]]; rerender(); } });
  const core = app.querySelector("[data-core]"); if (core) core.onchange = () => { draft.coreDone = core.checked; saveDraft(); };
  document.getElementById("date").onchange = e => { draft.date = e.target.value || todayISO(); saveDraft(); };
  document.getElementById("bw").oninput = e => { draft.bodyweight = parseNum(e.target.value); saveDraft(); };
  const add = document.getElementById("addex"); if (add) add.onclick = () => pickExercise(null);
  document.getElementById("back").onclick = () => { if (confirm("Training abbrechen? Bereits Eingetragenes wird verworfen.")) { draft = null; drop(DRAFT_KEY); drop(PENDING_KEY); state.split = null; showStart(); } };
  document.getElementById("finish").onclick = finish;
}
function markRow(i, k) {
  app.querySelectorAll(`[data-k^="${i}.${k}."]`).forEach(x => x.classList.add("done"));
  const t = app.querySelector(`[data-tick="${i}.${k}"]`); if (t) t.classList.add("on");
}
function keepScroll(fn) { const y = window.scrollY; fn(); window.scrollTo(0, y); }
// blockIndex = null: neue Übung am Ende; sonst als Supersatz zu diesem Block
function pickExercise(blockIndex) {
  const EX = data.exercises.filter(e => e.split === draft.split).concat(data.exercises.filter(e => e.split !== draft.split));
  const y = window.scrollY, target = blockIndex == null ? null : draft.items[blockIndex];
  const title = target ? "Supersatz zu " + target.exercises.map(x => EXMAP()[x].name).join(" Supersatz ") : "Übung hinzufügen";
  app.innerHTML = `<button class="link" id="cancel">‹ Zurück zum Training</button><h1 style="font-size:21px">${esc(title)}</h1>
    <div class="choices">${EX.filter(e => !target || !target.exercises.includes(e.id)).map(e => `<button class="choice" data-ex="${e.id}">${esc(e.name)}<small>${esc(SPLIT(e.split))}</small></button>`).join("")}</div>`;
  document.getElementById("cancel").onclick = () => { showWorkout(); window.scrollTo(0, y); };
  app.querySelectorAll("[data-ex]").forEach(b => b.onclick = () => {
    const ex = b.dataset.ex;
    if (target) { addExerciseToItem(target, ex, draft.location); saveDraft(); showWorkout(); window.scrollTo(0, y); }
    else { draft.items.push(makeItem([ex], draft.location, null, null)); saveDraft(); showWorkout(); window.scrollTo(0, document.body.scrollHeight); }
  });
  window.scrollTo(0, 0);
}
async function finish() {
  const s = draftToSession(draft, true);
  if (!s.items.length && !s.core && !s.stretches.length) { alert("Es ist noch kein Satz mit ✓ bestätigt."); return; }
  const open = draft.items.reduce((n, it) => n + it.done.filter(x => !x).length, 0);
  if (open && !confirm(open + " Sätze sind nicht mit ✓ bestätigt und werden nicht gespeichert. Trotzdem beenden?")) return;
  const btn = document.getElementById("finish"); btn.disabled = true; btn.textContent = "Speichert …";
  try {
    clearTimeout(saveTimer);
    await syncDraft(true);
    draft = null; drop(DRAFT_KEY); state.split = null;
    app.innerHTML = `<h1>Gespeichert</h1><div class="card"><p>${esc(SPLIT(s.split))} am ${dateDE(s.date)} ist in deinem OneDrive gespeichert.</p></div><button id="home">Zur Startseite</button>`;
    document.getElementById("home").onclick = showStart;
  } catch (e) {
    btn.disabled = false; btn.textContent = "Erneut versuchen";
    setStatus("Speichern in OneDrive fehlgeschlagen. Dein Training bleibt auf dem iPhone gesichert.", "bad");
  }
}

init();
</script>
